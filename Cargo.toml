[package]
name = "libbox64dl"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "test-driver"
path = "test.rs"

[dependencies]
abi-plan = { git = "https://github.com/Shyliuli/abi-plan.git" }
anyhow = "1.0.104"
cinline = { package = "ya-c-inline", git = "https://github.com/Shyliuli/ya_c_inline.git" }

[build-dependencies]
cmake = "0.1.58"
ya-c-inline-build = { git = "https://github.com/Shyliuli/ya_c_inline.git" }
