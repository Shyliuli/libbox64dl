[package]
name = "libbox64"
version = "0.1.0"
edition = "2024"
description = "Rust lifecycle owner and FFI boundary over the embeddable box64 engine"
license = "MIT"
build = "build.rs"

[lib]
name = "libbox64"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[features]
default = ["link-box64"]
# Link against ../vendor/box64/build/libbox64.a (and friends).
# Disable to type-check the Rust side alone: `cargo check --no-default-features`.
link-box64 = []
# Build against ../vendor/box64/build-pic (PIC) instead of build/ (static).
pic = []

[dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"
bindgen = "0.72"

# The engine sits behind foreign (C) frames that can `longjmp`; a Rust unwind
# must never cross that boundary. `panic = "abort"` makes any panic terminate
# instead of unwinding into C. It does NOT make a foreign longjmp safe (that is
# a structural rule: no live Rust frame between setjmp and longjmp) — see
# docs/engine-ownership.md.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
